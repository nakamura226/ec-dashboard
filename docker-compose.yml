services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-password}
      MYSQL_DATABASE: ${DATABASE_NAME:-ec_dashboard_development}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DATABASE_PASSWORD:-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    image: ec-dashboard:latest
    command: ["bin/dev"]
    volumes:
      - .:/rails
      - node_modules_data:/rails/node_modules
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password}
      DATABASE_NAME: ${DATABASE_NAME:-ec_dashboard_development}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    stdin_open: true
    tty: true

  worker:
    image: ec-dashboard:latest
    command: ["bin/rails", "solid_queue:start"]
    volumes:
      - .:/rails
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password}
      DATABASE_NAME: ${DATABASE_NAME:-ec_dashboard_development}
    depends_on:
      # Wait for `web` to be healthy (not just started), since `web` is the one
      # that runs db:prepare — starting `worker` any earlier races the initial
      # schema load on a brand-new database.
      web:
        condition: service_healthy

volumes:
  mysql_data:
  node_modules_data:
